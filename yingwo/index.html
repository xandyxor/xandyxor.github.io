function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){try{localStorage.setItem(KEY,JSON.stringify({screen:state.screen,name:state.name,birthday:state.birthday,birthHour:state.birthHour,blood:state.blood,mbti:state.mbti,answers:state.answers,loveAnswers:state.loveAnswers,feedback:state.feedback,people:state.people,selectedId:state.selectedId,pairAnswers:state.pairAnswers,dailyEntries:state.dailyEntries}))}catch(e){console.warn('儲存未成功：',e)}}
function scroll(){window.scrollTo({top:0,behavior:'instant'})}
function go(screen){state.screen=screen;state.error='';save();render();scroll()}
function notify(s){const t=$('toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(notify.timer);notify.timer=setTimeout(()=>t.classList.add('hidden'),3100)}
function signFor(b){if(!b)return null;const d=new Date(b+'T12:00:00');if(Number.isNaN(d.getTime()))return null;const m=d.getMonth()+1,day=d.getDate();let idx;if(m===1)idx=day>=20?1:0;else if(m===2)idx=day>=19?2:1;else if(m===3)idx=day>=21?3:2;else if(m===4)idx=day>=20?4:3;else if(m===5)idx=day>=21?5:4;else if(m===6)idx=day>=21?6:5;else if(m===7)idx=day>=23?7:6;else if(m===8)idx=day>=23?8:7;else if(m===9)idx=day>=23?9:8;else if(m===10)idx=day>=23?10:9;else if(m===11)idx=day>=22?11:10;else idx=day>=22?0:11;return signs[idx]}
function animalFor(b){if(!b)return null;const d=new Date(b+'T12:00:00');if(Number.isNaN(d.getTime()))return null;let yr=d.getFullYear();try{let parts=new Intl.DateTimeFormat('en-u-ca-chinese',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(d);const p=parts.find(x=>x.type==='relatedYear');if(p)yr=Number(p.value);else if(d.getMonth()<=1)return null}catch{if(d.getMonth()<=1)return null}return zodiacAnimals[((yr%12)+12)%12]}
function ownComplete(){return state.answers.every(x=>Number.isInteger(x)&&x>=1&&x<=5)}
function scores(){let ret={awareness:0,connection:0,energy:0,dialogue:0};for(const a of axes){let vals=questions.map((q,i)=>q.key===a.key?({v:state.answers[i],flip:q.flip}):null).filter(Boolean);ret[a.key]=Math.round(vals.reduce((s,x)=>s+((x.flip?6-x.v:x.v)-1)*25,0)/vals.length)}return ret}

function quiz(){const i=state.quizIndex,q=questions[i];const done=state.answers.filter(x=>x!==null).length;const opts=[['◔','完全不像'],['◡','不太像'],['◌','看情況'],['✧','有點像'],['✺','非常像']];return `<section class="workspace reveal"><div class="quiz-top"><div><div class="step-label">STEP 02 · ABOUT YOU</div><h1 style="margin-bottom:0">關於你的小小發現</h1></div><div class="progress-wrap"><div class="progress-bar"><span style="width:${done/8*100}%"></span></div><div class="count">已完成 ${done} / 8 題</div></div></div><div class="quiz-shell"><div class="quiz-card"><div class="question-kind">${String(i+1).padStart(2,'0')} / 08 &nbsp;·&nbsp; ${q.dim}</div><h2>${esc(q.text)}</h2><p class="desc">${esc(q.hint)}</p><div class="likert-grid">${opts.map((opt,j)=>`<button class="answer ${state.answers[i]===j+1?'selected':''}" data-answer="${j+1}" aria-label="${opt[1]}"><span class="answer-emoji">${opt[0]}</span><span>${opt[1]}</span></button>`).join('')}</div><div class="info-line" style="margin-top:27px;background:#fbf8fc"><span>✳</span><span>這裡沒有標準答案，只要照現在最接近你的感覺選就好。</span></div></div><div class="quiz-nav">${navButton('quizBack','← 上一題','btn btn-quiet btn-sm')}<span class="muted">${done===8?'你的名片已經在等你了 ✨':'慢慢選，不用急。'}</span>${navButton('quizNext',i===7?'看看我的名片 →':'下一題 →','btn btn-primary btn-sm')}</div></div></section>`}

function loveDone(){return state.loveAnswers.length===6&&state.loveAnswers.every(x=>Number.isInteger(x)&&x>=0&&x<=3)}
function loveKind(){const counts=[0,0,0,0];state.loveAnswers.forEach(x=>{if(Number.isInteger(x)&&x>=0&&x<4)counts[x]++});return loveTypes[counts.indexOf(Math.max(...counts))]}
function exploration(){const parts=[{name:'基礎人格',done:ownComplete()},{name:'愛情模式',done:loveDone()},{name:'星座故事',done:!!state.birthday},{name:'生肖文化',done:!!state.birthday},{name:'血型趣談',done:!!state.blood&&state.blood!=='不知道'},{name:'紫微資料',done:!!state.birthday&&!!state.birthHour},{name:'MBTI 自填',done:!!state.mbti},{name:'自我回饋',done:!!state.feedback}];return {parts,count:parts.filter(x=>x.done).length,total:parts.length,pct:Math.round(parts.filter(x=>x.done).length/parts.length*100)}}
function loveQuiz(){if(!ownComplete())return intro();const i=state.loveIndex,q=loveQuestions[i],done=state.loveAnswers.filter(x=>x!==null).length;return `<section class="workspace reveal" style="max-width:800px"><div class="quiz-top"><div><div class="step-label">CHAPTER TWO / LOVE & CONNECTION</div><h1>心動時的你，長什麼樣子？</h1></div><div class="progress-wrap"><div class="progress-bar"><span style="width:${done/6*100}%"></span></div><div class="count">${done} / 6 題</div></div></div><div class="v4-love-banner">♡ 一點點了解自己怎麼愛人，也了解自己想怎麼被愛。</div><div class="quiz-card v4-quiz-card"><span class="question-kind">${String(i+1).padStart(2,'0')} / 06 · ${q.category}</span><h2>${q.title}</h2><p class="desc">選一個現在最像你的答案。沒有理想型標準，只有偏好。</p><div class="v4-choice-list">${q.choices.map((c,j)=>`<button class="v4-choice ${state.loveAnswers[i]===j?'chosen':''}" data-love-answer="${j}"><span>${String.fromCharCode(65+j)}</span>${c}<b>${state.loveAnswers[i]===j?'✓':'↗'}</b></button>`).join('')}</div></div><div class="quiz-nav">${navButton('loveBack','← 上一題','btn btn-quiet btn-sm')}<span class="muted">答案可以隨時修改</span>${navButton('loveNext',i===5?'解鎖愛情名片 →':'下一題 →','btn btn-primary btn-sm')}</div></section>`}
function loveTab(){if(!loveDone())return `<div class="v4-locked"><div class="v4-locked-illustration">♡</div><div class="step-label">UNLOCK YOUR LOVE LANGUAGE</div><h2>你怎麼愛人？又想怎麼被愛？</h2><p>再用六個生活情境，拼出你在親密關係中的偏好。這是趣味自我探索，不是正式的依附型態或 MBTI 診斷。</p>${navButton('love','開始 6 題愛情探索 ↗','btn btn-primary')}</div>`;const t=loveKind(),sc=scores();return `<div class="v4-love-result reveal"><div class="v4-love-identity"><div class="v4-love-orb">${t.symbol}</div><div><div class="step-label">YOUR LOVE PORTRAIT · 愛情模式已解鎖</div><h2>${t.name}</h2><div class="v4-pill">${t.tag}</div><p>「${t.quote}」</p></div></div><div class="v4-love-cards"><article><span>01 / HOW YOU LOVE</span><h3>你怎麼表達愛</h3><p>${t.love}</p></article><article><span>02 / WHEN IT HURTS</span><h3>你怎麼面對衝突</h3><p>${t.conflict}</p></article><article><span>03 / YOUR TYPE</span><h3>你容易被誰吸引</h3><p>${t.attract}</p></article></div><div class="v4-question-prompt"><div><div class="step-label">ONE QUESTION FOR YOU</div><strong>${t.prompt}</strong><p>這張卡可以慢慢改變，因為人也會成長。</p></div>${navButton('loveRetake','重新探索 ↻','btn btn-light btn-compact')}</div><div class="notice">依六題自述產生的描述性故事；不是心理診斷、戀愛預測，也不代表你只能有這一種樣子。</div></div>`}
function overviewTab(s,p){const progress=exploration(),t=loveDone()?loveKind():null,sg=signFor(state.birthday),an=animalFor(state.birthday);return `<div class="v4-overview reveal"><div class="v4-progress-card"><div class="v4-progress-copy"><div class="step-label">YOUR GROWING UNIVERSE · 自我探索地圖</div><h2>你已經收集了 ${progress.count} / ${progress.total} 塊自己的碎片。</h2><p>不是「人格準確率」，而是目前已經體驗的探索主題。更多資料帶來更多角度，不等於命理更準。</p><div class="v4-progress-line"><span style="width:${progress.pct}%"></span></div><div class="v4-progress-meta"><b>${progress.pct}% 探索進度</b><small>還有 ${progress.total-progress.count} 個主題等你開啟</small></div></div><div class="v4-progress-flower">✺<small>你的宇宙<br>持續生長</small></div></div><div class="v4-worldhead"><div><div class="step-label">PICK A LITTLE UNIVERSE</div><h2>接下來，想看看哪一面的自己？</h2></div></div><div class="v4-world-grid"><button data-tab="personality" class="v4-world"><span class="v4-world-glyph">✳</span><small>PERSONALITY</small><strong>我的個性與內心</strong><p>四種相處面向、衝突與溝通的偏好。</p><i>已解鎖 →</i></button><button data-tab="love" class="v4-world"><span class="v4-world-glyph blush">♡</span><small>LOVE & ATTRACTION</small><strong>我的愛情模式</strong><p>怎麼愛人、怎麼吵架、最容易被誰吸引。</p><i>${t?'已解鎖 · '+t.name:'只要 6 題 · 點我解鎖'} →</i></button><button data-tab="astro" class="v4-world"><span class="v4-world-glyph mint">☽</span><small>ASTROLOGY</small><strong>我的星座與血型</strong><p>${sg?sg.name:'太陽星座'} · ${an||'生肖'} · ${state.blood||'血型故事'}</p><i>打開星命故事 →</i></button><button data-tab="ziwei" class="v4-world"><span class="v4-world-glyph purple">☯</span><small>ZI WEI</small><strong>紫微十二宮</strong><p>探索命宮、夫妻宮、福德宮等傳統主題。</p><i>文化導覽 · 未排盤 →</i></button><button data-tab="today" class="v4-world"><span class="v4-world-glyph gold">✦</span><small>DAILY RITUAL</small><strong>今日運勢與塔羅</strong><p>每日一句心情靈感，加上可記錄的心情日記。</p><i>看看今天的宇宙 →</i></button><button data-action="people" class="v4-world last"><span class="v4-world-glyph peach">∞</span><small>OUR RELATIONSHIP</small><strong>把另一個人放進來</strong><p>你的名片 × 你眼中的 TA，發現相處差異。</p><i>前往我的人物 →</i></button></div><div class="v4-feature-note"><div><span>✧ TODAY'S LITTLE PROMPT</span><strong>${t?t.prompt:'如果有人真的懂你，他會知道你最需要什麼？'}</strong><p>想想一個答案，不用急著交給別人評分。</p></div>${navButton('tarot','看看今日心語 →','btn btn-light btn-compact')}</div></div>`}
function dailyJournal(){const day=new Date().toLocaleDateString('en-CA'),entry=state.dailyEntries[day]||{},recent=Object.entries(state.dailyEntries).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,5);return `<div class="v4-journal"><div class="step-label">DEAR SELF · TODAY'S JOURNAL</div><h3>今天的你，過得還好嗎？</h3><p>把心情存進自己的小宇宙裡。這裡不是 AI 評分，而是你留給自己的紀錄。</p><div class="v4-moods">${[['☀','很有能量'],['♡','暖暖的'],['☁','有點累'],['☾','想安靜']].map(([icon,label])=>`<button class="${entry.mood===label?'on':''}" data-mood="${label}"><b>${icon}</b><span>${label}</span></button>`).join('')}</div><label class="v4-journal-label" for="journalNote">留給自己的幾句話 <small>選填，最多 160 字</small></label><textarea id="journalNote" maxlength="160" rows="3" placeholder="今天讓你印象最深的是……">${esc(entry.note||'')}</textarea><div class="v4-journal-foot"><small>僅存在這台裝置的瀏覽器</small>${navButton('saveJournal','存下今天的心情 ↗','btn btn-primary btn-compact')}</div>${recent.length?`<div class="v4-journal-list"><strong>最近的小小紀錄</strong>${recent.map(([d,e])=>`<div><span>${esc(d)}</span><b>${esc(e.mood||'未選心情')}</b><small>${esc(e.note||'今天沒有留下文字')}</small></div>`).join('')}</div>`:''}</div>`}

function observationScore(p,key){const v=Number(p.observations?.[key]);return Number.isInteger(v)&&v>=1&&v<=5?(v-1)*25:null}
function dimensionHint(key,a,b){const diff=Math.abs(a-b);if(diff<=24){return {
connection:'你們在需要清楚回應的程度上看起來比較接近，溝通期待可能容易對上。',dialogue:'你們面對誤會的步調看起來接近，較容易找到願意談話的時間。',energy:'你們對熱鬧與獨處的充電方式可能比較接近。',awareness:'你們注意情緒細節的程度看起來比較接近。'}[key]}
const high=a>b;const ideas={connection:high?'你可能比較需要清楚的關係回應；你觀察 TA 較偏好信任與空間。試著說出彼此舒服的聯絡節奏。':'你偏好信任與空間；但你觀察 TA 可能更需要明確確認。適度說清楚彼此的期待，能減少猜測。',dialogue:high?'你可能傾向趁早把誤會說清楚；你觀察 TA 比較需要先冷靜。可以先約定何時再談。':'你比較習慣想好再談；你觀察 TA 可能希望趁早處理。可以先說明「我會回來談」，避免沉默被誤會。',energy:high?'你比較容易從相聚補充能量；你觀察 TA 似乎更需要獨處。一起討論陪伴和休息的界線可能有幫助。':'你可能比較需要獨處充電；你觀察 TA 在相聚時比較有活力。先說明自己的充電方式，避免被理解成不在乎。',awareness:high?'你可能比 TA 更容易注意情緒小變化；比起猜想，直接溫柔地問一次可能更有幫助。':'你比較不會因細微訊號分心；你觀察 TA 似乎很在意語氣、表情。重要時刻多說清楚，可能減少誤會。'};return ideas[key]}
function relationshipData(p){const self=scores();const arr=observations.map(o=>{const b=observationScore(p,o.key);const a=self[o.key];return {...o,a,b,diff:b===null?null:Math.abs(a-b),hint:b===null?'還沒足夠資訊，先保留未知。':dimensionHint(o.key,a,b)}});const available=arr.filter(x=>x.b!==null),similar=available.filter(x=>x.diff<=24).sort((a,b)=>a.diff-b.diff),different=available.filter(x=>x.diff>=25).sort((a,b)=>b.diff-a.diff);return {arr,available,similar,different}}

function render(){const app=$('app');app.innerHTML=state.screen==='intro'?intro():state.screen==='quiz'?quiz():state.screen==='loveQuiz'?loveQuiz():state.screen==='result'?result():state.screen==='aboutPage'?aboutPage():state.screen==='sample'?sample():state.screen==='people'?peoples():state.screen==='personForm'?personForm():state.screen==='relationship'?relationship():home()}
function handleClick(e){const ans=e.target.closest('[data-answer]');if(ans){state.answers[state.quizIndex]=Number(ans.dataset.answer);save();if(state.quizIndex<7){state.quizIndex+=1;render();}else{if(state.answers.every(v=>v!==null)){state.activeTab='overview';go('result')}else{render();notify('已完成最後一題，確認前面有沒有漏答喔')}}return}
const loveAnswer=e.target.closest('[data-love-answer]');if(loveAnswer){state.loveAnswers[state.loveIndex]=Number(loveAnswer.dataset.loveAnswer);save();if(state.loveIndex<5)state.loveIndex++;else if(loveDone()){state.activeTab='love';go('result');return;}render();return;}
const pairtab=e.target.closest('[data-pairtab]');if(pairtab){state.pairTab=pairtab.dataset.pairtab;render();return;}
const mood=e.target.closest('[data-mood]');if(mood){const day=new Date().toLocaleDateString('en-CA');const prev=state.dailyEntries[day]||{};state.dailyEntries[day]={...prev,mood:mood.dataset.mood,note:document.getElementById('journalNote')?.value||prev.note||''};save();render();return;}
const palace=e.target.closest('[data-palace]');if(palace){state.palace=Number(palace.dataset.palace);render();return}
const tab=e.target.closest('[data-tab]');if(tab){state.activeTab=tab.dataset.tab;render();return}
const feedback=e.target.closest('[data-feedback]');if(feedback){state.feedback=feedback.dataset.feedback;save();render();return}
const b=e.target.closest('[data-action]');if(!b)return;switch(b.dataset.action){
case 'love':if(ownComplete()){state.loveIndex=state.loveAnswers.findIndex(x=>x===null);if(state.loveIndex<0)state.loveIndex=0;go('loveQuiz')}else go('intro');break;
case 'loveBack':if(state.loveIndex===0){state.activeTab='love';go('result')}else{state.loveIndex--;render()}break;
case 'loveNext':if(state.loveAnswers[state.loveIndex]===null){notify('先選一個比較像你的答案');break}if(state.loveIndex===5){if(loveDone()){state.activeTab='love';go('result')}else{state.loveIndex=state.loveAnswers.findIndex(x=>x===null);render()}}else{state.loveIndex++;render()}break;
case 'loveRetake':if(window.confirm('重新做愛情探索嗎？之前六題答案會清空。')){state.loveAnswers=Array(6).fill(null);state.loveIndex=0;go('loveQuiz')}break;
case 'saveJournal':{const day=new Date().toLocaleDateString('en-CA');const note=$('journalNote')?.value?.trim()?.slice(0,160)||'';const e=state.dailyEntries[day]||{};state.dailyEntries[day]={...e,note};save();render();notify('今天的心情已存到你的瀏覽器 ✧');break;}
case 'saveGuesses':{const vals=pairQuestions.map((q,i)=>document.querySelector(`input[name="guess${i}"]:checked`)?.value);if(vals.some(v=>v===undefined)){notify('三道題都選完才能繼續');break;}const id=state.selectedId;const old=relationPair();state.pairAnswers[id]={...old,guess:vals.map(Number),actual:[]};save();render();notify('已存下你的猜測，接下來可以把裝置交給 TA');break;}
case 'saveActuals':{const vals=pairQuestions.map((q,i)=>document.querySelector(`input[name="actual${i}"]:checked`)?.value);if(vals.some(v=>v===undefined)){notify('請先完成三道題');break;}const id=state.selectedId;const old=relationPair();state.pairAnswers[id]={...old,actual:vals.map(Number)};save();render();notify('你們的默契結果已揭曉 ♡');break;}
case 'resetPair':{if(!window.confirm('重新玩這三題嗎？舊答案將清空。'))break;delete state.pairAnswers[state.selectedId];save();render();break;}
case'result':if(ownComplete())go('result');else go('intro');break;
case'destiny':if(ownComplete()){state.activeTab='astro';go('result')}else{notify('先建立名片，就能探索你的命理小宇宙 ✧');go('intro')}break;
case'ziwei':if(ownComplete()){state.activeTab='ziwei';go('result')}else go('intro');break;
case'tarot':if(ownComplete()){state.activeTab='today';go('result')}else go('intro');break;
case'nextTarot':state.tarotDraw+=1;render();break;
case'people':if(ownComplete())go('people');else {notify('先建立自己的名片，就能加入想了解的人 ♡');go('intro')}break;
case'newPerson':openPerson();break;
case'editPerson':openPerson(b.dataset.id);break;
case'openRelationship':openRelationship(b.dataset.id);break;
case'deletePerson':{const p=state.people.find(x=>x.id===b.dataset.id);if(p&&window.confirm('確定要刪除「'+p.name+'」和相關的本機觀察嗎？')){state.people=state.people.filter(x=>x.id!==p.id);if(state.selectedId===p.id)state.selectedId=null;save();render();notify('已刪除這張本機人物卡')}break;}
case'savePerson':{const name=$('personName')?.value.trim();if(!name){notify('請先填寫一個暱稱');$('personName')?.focus();break}const birthday=$('personBirthday')?.value||'';const relation=$('personRelation')?.value||'其他';const blood=$('personBlood')?.value||'';const observations={};document.querySelectorAll('[data-obs]').forEach(el=>{observations[el.dataset.obs]=el.value||null});const id=state.editingId||('p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6));const pp={id,name,birthday,blood,relation,observations};const idx=state.people.findIndex(p=>p.id===id);if(idx<0)state.people.push(pp);else state.people[idx]=pp;state.editingId=null;state.selectedId=id;state.pairTab='overview';go('relationship');notify('已建立你們的關係卡 ♡');break;}
case'copyRel':{const p=findPerson();if(!p)break;const d=relationshipData(p);const a=d.different[0],good=d.similar[0];copyText(`映我 · ${state.name} × ${p.name} 的關係筆記\n可能合拍：${good?good.label+' — '+good.hint:'等待更多共同經驗'}\n值得聊聊：${a?a.label+' — '+a.hint:'目前沒有明顯差異或資料不足'}\n* 內容根據我的自述與對 TA 的觀察，並非對方的心理測驗結果。`);break;}
case'inviteText':{const p=findPerson();if(!p)break;copyText(`${p.name}，我最近在玩一個「從認識自己開始，再了解彼此」的小測驗。我先整理了一下自己對相處方式的想法，也很好奇你的真實感受。如果你願意，我們可以一起聊幾道題，看看有沒有什麼一直誤會的小事 ♡`);break;}
case'home':go('home');break;
case'start':case'edit':go('intro');break;
case'sample':go('sample');break;
case'introNext':{const nm=$('nickname');if(nm)state.name=nm.value.trim();if(!state.name){state.error='先填入想讓我們稱呼你的名字吧。';render();$('nickname')?.focus();break}state.birthday=$('birthday')?.value||'';state.blood=$('blood')?.value||'';state.birthHour=$('birthHour')?.value||'';state.mbti=$('mbti')?.value||'';if(ownComplete()){state.activeTab='overview';go('result');notify('個人資料已更新 ✧');break;}state.quizIndex=state.answers.findIndex(v=>v===null);if(state.quizIndex===-1)state.quizIndex=0;go('quiz');break}
case'quizBack':if(state.quizIndex===0)go('intro');else {state.quizIndex--;render()}break;
case'quizNext':if(state.answers[state.quizIndex]===null){notify('先選一個最接近現在的你的答案 ✧');break}if(state.quizIndex===7){if(!state.answers.every(v=>v!==null)){state.quizIndex=state.answers.findIndex(v=>v===null);render();notify('還有幾題沒有回答喔')}else{state.activeTab='overview';go('result')}}else{state.quizIndex++;render()}break;
case'retest':if(window.confirm('想再做一次這 8 題嗎？原本的答案會清空。')){state.answers=Array(8).fill(null);state.feedback='';state.quizIndex=0;go('quiz')}break;
case'copy':{const s=scores(),p=persona(s),sign=signFor(state.birthday);const out=`映我 · ${state.name} 的人格名片\n${p.name}\n「${p.quote}」\n${axes.map(a=>`${a.label}：${s[a.key]}/100`).join('\n')}${sign?'\n星座：'+sign.name:''}\n（8 題自我探索結果，僅供參考）`;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(out).then(()=>notify('已複製到剪貼簿 ♡')).catch(()=>fallbackCopy(out));else fallbackCopy(out);break}
case'download':downloadCard();break;
case'drawAgain':state.dailyOffset++;render();break;
case'about':go('aboutPage');break;
case'clear':if(window.confirm('確定清除這個 Demo 的我的名片、人物卡、關係觀察和回答嗎？')){['yingwo-relationship-demo-v3','yingwo-relationship-demo-v2','yingwo-mvp-demo-v1'].forEach(k=>localStorage.removeItem(k));localStorage.removeItem(KEY);state.name='';state.birthday='';state.birthHour='';state.blood='';state.mbti='';state.answers=Array(8).fill(null);state.loveAnswers=Array(6).fill(null);state.pairAnswers={};state.dailyEntries={};state.feedback='';state.people=[];state.selectedId=null;state.activeTab='overview';go('home');notify('本機 Demo 資料已清除')}break;
}}
function fallbackCopy(text){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();notify(ok?'已複製到剪貼簿 ♡':'瀏覽器未允許複製，請使用儲存圖片')}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function downloadCard(){try{const canvas=document.createElement('canvas'),c=canvas.getContext('2d');canvas.width=1080;canvas.height=1350;const grad=c.createLinearGradient(0,0,1080,1350);grad.addColorStop(0,'#87709f');grad.addColorStop(.53,'#594b7d');grad.addColorStop(1,'#33344f');c.fillStyle=grad;c.fillRect(0,0,1080,1350);c.strokeStyle='rgba(255,255,255,.13)';c.lineWidth=3;[400,520,640].forEach(r=>{c.beginPath();c.arc(940,280,r,0,Math.PI*2);c.stroke()});c.fillStyle='#fff';c.font='38px serif';c.fillText('✳  映我  ·  YINGWO',77,102);c.textAlign='right';c.font='25px sans-serif';c.fillStyle='#d9cde7';c.fillText('PERSONALITY NOTE / 01',1001,102);c.textAlign='center';c.fillStyle='#ffdae6';c.font='230px serif';const p=persona(scores());c.fillText(p.symbol,540,514);c.font='35px sans-serif';c.fillStyle='#e6d8ec';c.fillText(state.name,540,653);c.fillStyle='#ffffff';c.font='bold 75px "Noto Serif CJK TC",serif';c.fillText(p.name,540,786);c.font='34px "Noto Sans TC",sans-serif';c.fillStyle='#eae0ec';let words=p.quote;let len=0,line='',y=869;for(const ch of words){if(len>=19){c.fillText(line,540,y);line='';len=0;y+=61}line+=ch;len++}if(line)c.fillText(line,540,y);c.strokeStyle='#ffffff40';c.lineWidth=2;c.beginPath();c.moveTo(85,1110);c.lineTo(995,1110);c.stroke();c.textAlign='left';c.font='29px sans-serif';c.fillStyle='#e9d9ec';c.fillText('慢慢，看見自己的模樣。',88,1192);c.textAlign='right';const sign=signFor(state.birthday);c.fillText(sign?sign.symbol+'  '+sign.name:'✧  你的探索旅程',993,1192);c.font='19px sans-serif';c.fillStyle='#c7b6d5';c.textAlign='center';c.fillText('8 題自我探索 · 非心理診斷 · 星座僅供娛樂',540,1279);const a=document.createElement('a');a.download='映我-'+(state.name.replace(/[\\/:*?"<>|]/g,'').slice(0,15)||'我的名片')+'.png';a.href=canvas.toDataURL('image/png');a.click();notify('你的名片圖片已建立 ✨')}catch(e){console.error(e);notify('圖片產生失敗，請改用複製摘要')}}
$('app').addEventListener('click',handleClick);
$('app').addEventListener('input',e=>{if(e.target.id==='nickname'){state.name=e.target.value;save()}else if(e.target.id==='birthday'){state.birthday=e.target.value;save()}else if(e.target.id==='blood'){state.blood=e.target.value;save()}else if(e.target.id==='birthHour'){state.birthHour=e.target.value;save()}});
document.querySelector('.nav').addEventListener('click',handleClick);document.querySelector('#bottomNav').addEventListener('click',handleClick);
render();
})();
</script>
